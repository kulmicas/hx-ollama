name: CI & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify Dependencies & Build
        run: |
          go vet ./...
          CGO_ENABLED=0 go build -o bin/hx-ollama main.go
          ./bin/hx-ollama --help
          ./bin/hx-ollama --version

  cross-compile:
    name: Cross Compile Static Binaries
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Matrix
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/hx-ollama-linux-amd64 main.go
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o dist/hx-ollama-linux-arm64 main.go
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o dist/hx-ollama-darwin-amd64 main.go
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o dist/hx-ollama-darwin-arm64 main.go
          ls -lh dist/
